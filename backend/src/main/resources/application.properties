# Application Name & Port
spring.application.name=rag-docs
server.port=${PORT:8080}

# Database Configuration (TiDB Cloud / MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&allowPublicKeyRetrieval=true&useSSL=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:YB3Ah3ES5xG28Dx.root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration (Auto Table Creation & Updates)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# File Upload Multipart Configuration (Max 50MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}

# Storage Configuration
app.upload.dir=${FILE_UPLOAD_DIR:D:/ai-document-assistant/uploads}

# Gemini AI API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
gemini.temperature=0.2
gemini.max-tokens=4096

# RAG Configuration
rag.chunk-size=1000
rag.chunk-overlap=200
rag.top-k=${RAG_TOP_K:12}
rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.25}

# Logging
logging.level.com.example.aidocumentassistant=INFO
logging.level.org.springframework.web=INFO
