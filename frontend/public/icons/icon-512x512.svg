<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Ambient Inner Glow Border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Document Silhouette -->
  <g filter="url(#shadow)">
    <!-- Document Page Base -->
    <path d="M140 110 C 140 98, 150 88, 162 88 L 290 88 L 372 170 L 372 400 C 372 412, 362 422, 350 422 L 162 422 C 150 422, 140 412, 140 400 Z" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="6"/>
    
    <!-- Page Corner Fold -->
    <path d="M290 88 L 290 158 C 290 170, 300 170, 312 170 L 372 170" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="5"/>
  </g>

  <!-- Central AI Sparkle / Brain Node -->
  <g transform="translate(256, 270)">
    <!-- Bot / Vector Core -->
    <circle cx="0" cy="0" r="68" fill="url(#accentGrad)" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="76" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-dasharray="8 8"/>
    
    <!-- Bot Face Elements -->
    <rect x="-34" y="-14" width="22" height="28" rx="10" fill="#ffffff"/>
    <rect x="12" y="-14" width="22" height="28" rx="10" fill="#ffffff"/>
    <path d="M-18 24 Q 0 34, 18 24" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Antennas / Synapse Nodes -->
    <circle cx="-50" cy="-50" r="10" fill="#38bdf8"/>
    <line x1="-50" y1="-50" x2="-28" y2="-28" stroke="#38bdf8" stroke-width="4"/>
    
    <circle cx="50" cy="-50" r="10" fill="#a855f7"/>
    <line x1="50" y1="-50" x2="28" y2="-28" stroke="#a855f7" stroke-width="4"/>
  </g>

  <!-- Text / Vector Flow Waves -->
  <path d="M180 376 L 332 376" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M180 396 L 270 396" stroke="rgba(255,255,255,0.4)" stroke-width="5" stroke-linecap="round"/>
</svg>